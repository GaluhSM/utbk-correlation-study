name: R CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_SANDBOX_ENABLED: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Setup renv
        uses: r-lib/actions/setup-renv@v2

      - name: Jalankan lintr (hanya melaporkan, tidak menggagalkan CI)
        run: |
          jumlah_lint <- 0L
          for (folder in c("R", "scripts", "tests")) {
            lints <- lintr::lint_dir(folder)
            print(lints)
            jumlah_lint <- jumlah_lint + length(lints)
          }
          message("Total temuan lintr: ", jumlah_lint)
        shell: Rscript {0}

      - name: Jalankan testthat
        run: testthat::test_dir("tests/testthat")
        shell: Rscript {0}